
name: Build MoviePass Wallet APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q MoviePassWallet-Android-Project.zip -d extracted

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: extracted/MoviePassWallet
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoviePassWallet-APK
          path: extracted/MoviePassWallet/app/build/outputs/apk/debug/app-debug.apk
          
